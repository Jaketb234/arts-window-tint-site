<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>{{ page.title }}</title>

    <meta
        name="description"
        content="{{ page.description }}"
    />

    <meta name="robots" content="index, follow" />

    <link
        rel="canonical"
        href="https://artswindowtintppf.com{{ page.url }}"
    />

    <meta
        property="og:title"
        content="{{ page.title }}"
    />

    <meta
        property="og:description"
        content="{{ page.description }}"
    />

    <meta property="og:type" content="website" />

    <meta
        property="og:url"
        content="https://artswindowtintppf.com{{ page.url }}"
    />

    <meta
        property="og:image"
        content="https://artswindowtintppf.com/images/AWTLogo.jpg"
    />

    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "AutomotiveBusiness",
        "name": "Art's Window Tint & PPF",
        "image": "https://artswindowtintppf.com/images/AWTLogo.jpg",
        "url": "https://artswindowtintppf.com/",
        "telephone": "+1-470-420-1438",
        "address": {
            "@type": "PostalAddress",
            "streetAddress": "3353 Acworth Summit Boulevard, Unit 340",
            "addressLocality": "Acworth",
            "addressRegion": "GA",
            "postalCode": "30101",
            "addressCountry": "US"
        },
        "areaServed": [
            "Acworth GA",
            "Kennesaw GA",
            "Marietta GA",
            "Woodstock GA",
            "Canton GA",
            "Cartersville GA",
            "Dallas GA",
            "Powder Springs GA",
            "Smyrna GA",
            "Atlanta GA"
        ],
        "priceRange": "$$",
        "sameAs": [
            "https://www.instagram.com/artswindowtint/"
        ]
    }
    </script>

    <link
        rel="stylesheet"
        href="/assets/css/base.css"
    />

    <link
        rel="stylesheet"
        href="/assets/css/sections.css"
    />

    <link
        rel="stylesheet"
        href="/assets/css/responsive.css"
    />

    <link
        rel="stylesheet"
        href="/assets/css/service-pages.css"
    />
</head>

<body>

<!-- ==================================================
     SITE HEADER
================================================== -->

<header class="site-header">
    <div class="container nav-container">
        <a
            class="logo"
            href="/"
            aria-label="Art's Window Tint & PPF home"
        >
            <img
                src="/images/AWTLogo.jpg"
                alt="Art's Window Tint & PPF logo"
                class="logo-img"
            />

            <span class="logo-text">
                <span class="logo-main">
                    Art's Window Tint & PPF
                </span>

                <span class="logo-sub">
                    Acworth, Georgia
                </span>
            </span>
        </a>

        <button
            class="menu-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="main-navigation"
            aria-label="Open navigation menu"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav
            id="main-navigation"
            class="main-nav"
            aria-label="Main navigation"
        >
            <a href="/#services">Services</a>
            <a href="/#gallery">Gallery</a>
            <a href="/#reviews">Reviews</a>
            <a href="/#service-area">Service Area</a>
            <a href="/#faqs">FAQs</a>

            <a
                href="/#booking"
                class="nav-book"
            >
                Book Now
            </a>
        </nav>
    </div>
</header>

<main>
    {{ content }}
</main>

<!-- ==================================================
     SITE FOOTER
================================================== -->

<footer class="site-footer">
    <div class="container footer-content">
        <p>
            © <span id="year"></span>
            Art's Window Tint & PPF
        </p>

        <p>
            Acworth · Kennesaw · Marietta · Woodstock
        </p>
    </div>
</footer>

<!-- ==================================================
     MOBILE ACTION BAR
================================================== -->

<div
    class="mobile-action-bar"
    aria-label="Quick actions"
>
    <a href="tel:14704201438">
        Call
    </a>

    <a href="sms:14704201438">
        Text
    </a>

    <a href="/#booking">
        Book
    </a>
</div>

<script src="/assets/js/site.js"></script>

</body>
</html>
